---
version: "3.9"

x-base-env: &env
  TZ: ${TZ:-UTC}

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: wikicat-db
    restart: unless-stopped
    environment:
      <<: *env
      POSTGRES_DB: wikicat
      POSTGRES_USER: wikicat
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wikicat}
      PGDATA: /var/lib/postgresql/data/pgdata
      PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-256MB}
      PG_EFFECTIVE_CACHE_SIZE: ${PG_EFFECTIVE_CACHE_SIZE:-768MB}
    volumes:
      - wikicat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikicat -d wikicat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - wikicat-net
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: deploy/railway/api.Dockerfile
    image: wikicat-api:local
    container_name: wikicat-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *env
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgres://wikicat:${DB_PASSWORD:-wikicat}@db:5432/wikicat
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-604800}
      ATTACHMENTS_DIR: /attachments
      ATTACHMENTS_LARGE_DIR: /attachments-large
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost,https://localhost}
      MAX_ATTACHMENT_STANDARD_MB: ${MAX_ATTACHMENT_STANDARD_MB:-20}
      MAX_ATTACHMENT_LARGE_MB: ${MAX_ATTACHMENT_LARGE_MB:-2048}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-admin@example.com}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-ChangeMe123!}
      INIT_ADMIN_NAME: ${INIT_ADMIN_NAME:-Administrator}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      DB_WAIT_TIMEOUT_SECONDS: ${DB_WAIT_TIMEOUT_SECONDS:-180}
    volumes:
      - wikicat-attachments:/attachments
      - wikicat-attachments-large:/attachments-large
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - wikicat-net
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: deploy/railway/web.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: wikicat-web:local
    container_name: wikicat-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *env
      PORT: 8080
      WIKICAT_API_URL: http://api:3000
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - wikicat-net
    security_opt:
      - no-new-privileges:true

  proxy:
    image: docker.io/library/caddy:2-alpine
    container_name: wikicat-proxy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      <<: *env
      WIKICAT_DOMAIN: ${WIKICAT_DOMAIN:-localhost}
      WIKICAT_API_HOST: api
      WIKICAT_API_PORT: 3000
      WIKICAT_WEB_HOST: web
      WIKICAT_WEB_PORT: 8080
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - wikicat-caddy-data:/data
      - wikicat-caddy-config:/config
      - ./deploy/caddy/certs:/etc/caddy/certs:ro
    networks:
      - wikicat-net
    security_opt:
      - no-new-privileges:true

volumes:
  wikicat-db-data:
    name: wikicat-db-data
  wikicat-attachments:
    name: wikicat-attachments
  wikicat-attachments-large:
    name: wikicat-attachments-large
  wikicat-caddy-data:
    name: wikicat-caddy-data
  wikicat-caddy-config:
    name: wikicat-caddy-config

networks:
  wikicat-net:
    driver: bridge
    name: wikicat-net
