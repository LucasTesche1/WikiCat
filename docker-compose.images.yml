---
name: wikicat

services:
  db:
    image: ${WIKICAT_DB_IMAGE:-wikicat-db:local}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wikicat}
      POSTGRES_USER: ${POSTGRES_USER:-wikicat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wikicat}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - wikicat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wikicat} -d ${POSTGRES_DB:-wikicat}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - wikicat-net

  back-end:
    image: ${WIKICAT_BACK_END_IMAGE:-wikicat-back-end:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-wikicat}:${DB_PASSWORD:-wikicat}@db:5432/${POSTGRES_DB:-wikicat}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-604800}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost,http://localhost:8080,http://localhost:5173}
      ATTACHMENTS_DIR: /attachments
      ATTACHMENTS_LARGE_DIR: /attachments-large
      MAX_ATTACHMENT_STANDARD_MB: ${MAX_ATTACHMENT_STANDARD_MB:-20}
      MAX_ATTACHMENT_LARGE_MB: ${MAX_ATTACHMENT_LARGE_MB:-2048}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-admin@wikicat.local}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-ChangeThisAdminPassword1}
      INIT_ADMIN_NAME: ${INIT_ADMIN_NAME:-WikiCat Admin}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      DB_WAIT_TIMEOUT_SECONDS: ${DB_WAIT_TIMEOUT_SECONDS:-180}
      DB_SSL_MODE: ${DB_SSL_MODE:-}
    volumes:
      - wikicat-attachments:/attachments
      - wikicat-attachments-large:/attachments-large
    networks:
      - wikicat-net

  front-end:
    image: ${WIKICAT_FRONT_END_IMAGE:-wikicat-front-end:local}
    restart: unless-stopped
    depends_on:
      back-end:
        condition: service_healthy
    networks:
      - wikicat-net

  proxy:
    image: ${WIKICAT_PROXY_IMAGE:-wikicat-proxy:local}
    restart: unless-stopped
    depends_on:
      back-end:
        condition: service_healthy
      front-end:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - wikicat-net

volumes:
  wikicat-db-data:
  wikicat-attachments:
  wikicat-attachments-large:

networks:
  wikicat-net:
    driver: bridge
